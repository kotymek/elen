name: Test ELEN
on:
  pull_request:
  push:
    branches-ignore: [feat/production-dashboard]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
